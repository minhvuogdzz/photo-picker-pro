[package]
name = "photo-picker-pro"
version = "1.3.13"
description = "Photo Picker Pro - Smart photo filtering for photography studios"
authors = ["Photo Picker Pro"]
edition = "2021"

[lib]
name = "photo_picker_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
rayon = "1.10"
glob = "0.3"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
image = "0.25"
dirs = "5"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
