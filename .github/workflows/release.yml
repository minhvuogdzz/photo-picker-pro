name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm install

      - name: Download MPhoton.app from private assets repo (macOS only)
        if: matrix.platform == 'macos-latest'
        env:
          ASSETS_GITHUB_TOKEN: ${{ secrets.ASSETS_GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p src-tauri/resources/apps
          # Get asset download URL from latest release
          ASSET_URL=$(curl -s \
            -H "Authorization: Bearer $ASSETS_GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/minhvuogdzz/mvd-studio-assets/releases/latest" \
            | python3 -c "import sys,json; assets=json.load(sys.stdin)['assets']; print(next(a['url'] for a in assets if a['name']=='MPhoton.app.zip'))")
          # Download the asset
          curl -L \
            -H "Authorization: Bearer $ASSETS_GITHUB_TOKEN" \
            -H "Accept: application/octet-stream" \
            "$ASSET_URL" \
            -o src-tauri/resources/apps/MPhoton.app.zip
          cd src-tauri/resources/apps && unzip -q MPhoton.app.zip && rm MPhoton.app.zip

      - name: Clean secrets
        env:
          RAW_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
        shell: bash
        run: |
          CLEANED_KEY=$(echo "$RAW_KEY" | tr -d ' \n\r')
          echo "CLEANED_TAURI_PRIVATE_KEY=$CLEANED_KEY" >> $GITHUB_ENV

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ env.CLEANED_TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.CLEANED_TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Photo Picker Pro v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      - name: Force upload latest.json
        if: matrix.platform == 'macos-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "src-tauri/target/release/bundle/macos/latest.json" ]; then
            gh release upload ${{ github.ref_name }} src-tauri/target/release/bundle/macos/latest.json --clobber
          fi
